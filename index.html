<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordinal Voyagers - Official Mint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #121212;
            --container-bg: #1E1E1E;
            --primary-text: #EAEAEA;
            --secondary-text: #A0A0A0;
            --accent-color: #00ff9d;
            --border-color: #333333;
            --button-hover: #1cce8a;
            --disabled-color: #555;
            --danger-color: #ff4136;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--background-color);
            color: var(--primary-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 30px;
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .left-panel {
            flex: 1;
            text-align: left;
        }

        .collection-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .collection-title {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }

        .collection-description {
            font-size: 1.1em;
            color: var(--secondary-text);
            line-height: 1.6;
        }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .wallet-connector {
            position: relative;
        }

        .connect-wallet-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
            background-color: var(--accent-color);
            color: #121212;
        }
        .connect-wallet-btn:hover {
            background-color: var(--button-hover);
        }

        .wallet-dropdown {
            display: none;
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            position: absolute;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            z-index: 10;
            overflow: hidden;
        }
        .wallet-dropdown li {
            padding: 12px 15px;
            cursor: pointer;
        }
        .wallet-dropdown li:hover {
            background-color: #383838;
        }

        #connectionDetails {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        #connectionDetails h3 {
            margin: 0 0 10px 0;
            font-size: 1em;
            color: var(--secondary-text);
            font-weight: 400;
        }
        #walletAddressDisplay, #walletBalanceDisplay {
            word-wrap: break-word;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        #walletBalanceDisplay {
            font-weight: 700;
            color: var(--primary-text);
        }
        #signOutButton {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: none;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #signOutButton:hover {
            background-color: var(--danger-color);
            color: white;
        }

        #mintInterface {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        #mintInterface.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        
        .mint-status-bar {
            width: 100%;
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .mint-progress {
            width: 0%; /* Will be set by JavaScript */
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.5s ease-in-out;
        }

        .mint-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: var(--primary-text);
            cursor: pointer;
            font-size: 1.2em;
        }
        #quantityInput {
            width: 50px;
            height: 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            background: var(--background-color);
            color: var(--primary-text);
            font-family: inherit;
            border-radius: 4px;
        }

        #mintButton {
            width: 100%;
            padding: 15px;
            font-size: 1.4em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
            background-color: var(--accent-color);
            color: #121212;
            margin-top: auto;
        }
        #mintButton:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; padding: 20px; }
            .collection-title { font-size: 2em; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="left-panel">
            <img src="https://via.placeholder.com/400x400.png/00ff9d/121212?text=Ordinal+Voyager" alt="Collection NFT Image" class="collection-image">
            <h1 class="collection-title">Ordinal Voyagers</h1>
            <p class="collection-description">A limited collection of unique explorers inscribed forever on the Bitcoin blockchain. Join the voyage.</p>
        </div>
        
        <div class="right-panel">
            <div class="wallet-connector" id="walletConnector">
                <button class="connect-wallet-btn" id="connectWalletBtn">Connect Wallet to Mint</button>
                <ul class="wallet-dropdown" id="walletDropdown">
                    <li data-wallet="xverse">Xverse</li>
                    <li data-wallet="unisat">UniSat</li>
                </ul>
            </div>

            <div id="connectionDetails" class="hidden">
                <h3>Connected Wallet</h3>
                <div id="walletAddressDisplay"></div>
                <div id="walletBalanceDisplay"></div>
                <button id="signOutButton">Disconnect</button>
            </div>

            <div id="mintInterface" class="disabled">
                <div class="mint-info-row">
                    <span>Supply</span>
                    <span id="supplyDisplay">0 / 0</span>
                </div>
                <div class="mint-status-bar"><div class="mint-progress" id="mintProgressBar"></div></div>
                <hr style="border-color: var(--border-color); margin: 20px 0;">

                <div class="mint-info-row">
                    <span>Price</span>
                    <span id="mintPriceDisplay"></span>
                </div>

                <div class="mint-info-row">
                    <span>Quantity</span>
                    <div class="quantity-control">
                        <button class="quantity-btn" id="decreaseQtyBtn">-</button>
                        <input type="number" id="quantityInput" value="1" min="1" max="10">
                        <button class="quantity-btn" id="increaseQtyBtn">+</button>
                    </div>
                </div>

                <div class="mint-info-row" style="font-weight: 700; font-size: 1.2em;">
                    <span>Total</span>
                    <span id="totalCostDisplay"></span>
                </div>

                <button id="mintButton" disabled>Connect Wallet</button>
            </div>
        </div>
    </div>

    <script>
        // --- Collection Configuration ---
        const MINT_PRICE_BTC = 0.000001;
        const COLLECTION_SIZE = 1000;
        const MINTED_SO_FAR = 15; // Example: how many have been minted already
        const MAX_MINT_PER_TX = 10;
        const MINT_LIVE_DATE = new Date("2025-09-27T14:00:00Z"); // Set to a future date for countdown, UTC timezone

        // --- State Variables ---
        let connectedAccount = null;
        let connectedWalletName = null;
        let mintIsLive = false;

        // --- DOM Element References ---
        const connectWalletBtn = document.getElementById('connectWalletBtn');
        const walletConnector = document.getElementById('walletConnector');
        const walletDropdown = document.getElementById('walletDropdown');
        const connectionDetails = document.getElementById('connectionDetails');
        const walletAddressDisplay = document.getElementById('walletAddressDisplay');
        const walletBalanceDisplay = document.getElementById('walletBalanceDisplay');
        const signOutButton = document.getElementById('signOutButton');
        const mintInterface = document.getElementById('mintInterface');
        const mintButton = document.getElementById('mintButton');
        const quantityInput = document.getElementById('quantityInput');
        const decreaseQtyBtn = document.getElementById('decreaseQtyBtn');
        const increaseQtyBtn = document.getElementById('increaseQtyBtn');
        const totalCostDisplay = document.getElementById('totalCostDisplay');
        const supplyDisplay = document.getElementById('supplyDisplay');
        const mintPriceDisplay = document.getElementById('mintPriceDisplay');
        const mintProgressBar = document.getElementById('mintProgressBar');

        // --- Wallet Connection Logic ---

        async function connectXverse() {
            try {
                if (!window.XverseProviders || !window.XverseProviders.BitcoinProvider) {
                    throw new Error("Xverse provider not found. Please install the Xverse extension.");
                }

                const response = await window.XverseProviders.BitcoinProvider.request('wallet_connect', { addresses: ['ordinals', 'payment'] });
                if (response.error) throw new Error(response.error.message);
                
                const ordAddressInfo = response.result.addresses.find(a => a.purpose === 'ordinals');
                if (!ordAddressInfo || !ordAddressInfo.address) {
                    throw new Error('Could not retrieve a suitable Ordinals address from Xverse.');
                }
                
                const balanceResponse = await window.XverseProviders.BitcoinProvider.request('get_balance', { address: ordAddressInfo.address });
                
                // **THE FIX IS HERE**: Safely check the balance response structure
                let totalBalance = 0;
                if (balanceResponse && balanceResponse.result && typeof balanceResponse.result.total !== 'undefined') {
                    totalBalance = balanceResponse.result.total;
                } else {
                    console.warn("Could not read total from Xverse balance response. Defaulting to 0.", balanceResponse);
                }

                await handleWalletConnected(ordAddressInfo.address, 'Xverse', totalBalance);

            } catch (e) {
                console.error('Xverse connection error:', e);
                alert(`Failed to connect with Xverse: ${e.message}`);
            }
        }

        async function connectUnisat() {
            try {
                if (typeof window.unisat === 'undefined') {
                    throw new Error("UniSat Wallet is not installed. Please install the extension.");
                }
                const accounts = await window.unisat.requestAccounts();
                if (accounts && accounts.length > 0) {
                    const balance = await window.unisat.getBalance();
                    await handleWalletConnected(accounts[0], 'UniSat', balance.total);

                    window.unisat.on('accountsChanged', async (newAccounts) => {
                        if (connectedWalletName === 'UniSat' && newAccounts && newAccounts.length > 0) {
                            const newBalance = await window.unisat.getBalance();
                            await handleWalletConnected(newAccounts[0], 'UniSat', newBalance.total);
                        } else {
                            await handleWalletDisconnected();
                        }
                    });
                }
            } catch (e) {
                console.error('UniSat connection error:', e);
                alert(`Failed to connect with UniSat: ${e.message}`);
            }
        }

        async function handleWalletConnected(address, walletName, balanceInSats) {
            connectedAccount = address;
            connectedWalletName = walletName;
            updateWalletUI(true, address, balanceInSats);
            updateMintInterface(true);
        }

        async function handleWalletDisconnected() {
            connectedAccount = null;
            connectedWalletName = null;
            updateWalletUI(false);
            updateMintInterface(false);
        }

        // --- UI Update & Mint Logic ---

        function updateWalletUI(isConnected, address = '', balanceInSats = 0) {
            walletConnector.classList.toggle('hidden', isConnected);
            connectionDetails.classList.toggle('hidden', !isConnected);
            if (isConnected) {
                const shortAddress = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
                const balanceInBtc = (balanceInSats / 100_000_000).toFixed(8);
                walletAddressDisplay.innerText = `Address: ${shortAddress}`;
                walletBalanceDisplay.innerText = `Balance: ${balanceInBtc} BTC`;
            }
        }

        function updateMintInterface(isEnabled) {
            mintInterface.classList.toggle('disabled', !isEnabled);
            mintButton.disabled = !isEnabled;
            if (!isEnabled) {
                mintButton.textContent = "Connect Wallet";
                quantityInput.value = 1;
                updateTotalCost();
            } else {
                checkMintStatus(); // This will set button text to countdown or "Mint Now"
            }
        }
        
        function checkMintStatus() {
            const now = new Date();
            if (now >= MINT_LIVE_DATE) {
                mintIsLive = true;
                mintButton.textContent = "Mint Now";
                mintButton.disabled = false; // Re-enable if it was disabled by countdown
            } else {
                mintIsLive = false;
                mintButton.disabled = true;
                const timeToMint = MINT_LIVE_DATE - now;
                const days = Math.floor(timeToMint / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeToMint % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeToMint % (1000 * 60 * 60)) / (1000 * 60));
                mintButton.textContent = `Mint starts in ${days}d ${hours}h ${minutes}m`;
            }
        }

        function updateTotalCost() {
            const quantity = parseInt(quantityInput.value) || 0;
            const total = quantity * MINT_PRICE_BTC;
            totalCostDisplay.innerText = `${total.toFixed(8)} BTC`;
        }

        function initializeMintDetails() {
            mintPriceDisplay.innerText = `${MINT_PRICE_BTC} BTC`;
            supplyDisplay.innerText = `${MINTED_SO_FAR} / ${COLLECTION_SIZE} MINTED`;
            quantityInput.max = MAX_MINT_PER_TX;
            const progressPercent = (MINTED_SO_FAR / COLLECTION_SIZE) * 100;
            mintProgressBar.style.width = `${progressPercent}%`;
            updateTotalCost();
        }

        // --- Event Listeners ---

        document.addEventListener('DOMContentLoaded', () => {
            initializeMintDetails();
            setInterval(checkMintStatus, 30000); // Update countdown every 30 seconds
            checkMintStatus(); // Initial check
        });

        connectWalletBtn.addEventListener('click', () => {
            walletDropdown.style.display = 'block';
        });

        walletOptions.forEach(option => {
            option.addEventListener('click', (event) => {
                walletDropdown.style.display = 'none';
                if (event.target.dataset.wallet === 'unisat') connectUnisat();
                else if (event.target.dataset.wallet === 'xverse') connectXverse();
            });
        });

        signOutButton.addEventListener('click', handleWalletDisconnected);
        
        document.addEventListener('click', (event) => {
            if (!walletConnector.contains(event.target)) {
                walletDropdown.style.display = 'none';
            }
        });

        decreaseQtyBtn.addEventListener('click', () => {
            let qty = parseInt(quantityInput.value);
            if (qty > 1) {
                quantityInput.value = qty - 1;
                updateTotalCost();
            }
        });

        increaseQtyBtn.addEventListener('click', () => {
            let qty = parseInt(quantityInput.value);
            if (qty < MAX_MINT_PER_TX) {
                quantityInput.value = qty + 1;
                updateTotalCost();
            }
        });

        quantityInput.addEventListener('input', updateTotalCost);

        mintButton.addEventListener('click', () => {
            if (!connectedAccount) return alert("Please connect your wallet first.");
            if (!mintIsLive) return alert("The mint has not started yet.");
            
            const quantity = quantityInput.value;
            const totalCost = totalCostDisplay.innerText;
            
            // This is the point where you would integrate with a backend or API.
            alert(`--- MINT INITIATED (SIMULATION) ---\n\nRecipient Address: ${connectedAccount}\nQuantity: ${quantity}\nTotal Cost: ${totalCost}\n\nNext Step: Call an inscription service API to get a payment address.`);
        });
    </script>
</body>
</html>
