<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordinal Voyagers - Official Mint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #121212;
            --container-bg: #1E1E1E;
            --primary-text: #EAEAEA;
            --secondary-text: #A0A0A0;
            --accent-color: #00ff9d;
            --border-color: #333333;
            --button-hover: #1cce8a;
            --disabled-color: #555;
            --danger-color: #ff4136;
        }
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--background-color);
            color: var(--primary-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--container-bg);
            padding: 30px 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px MINT_PRICE_BTCpx rgba(0, 0, 0, 0.5);
        }

        .collection-title {
            font-size: 2.5em;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: var(--accent-color);
        }

        .collection-description {
            font-size: 1.1em;
            color: var(--secondary-text);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .wallet-connector {
            position: relative;
        }

        .connect-wallet-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
            background-color: var(--accent-color);
            color: #121212;
        }
        .connect-wallet-btn:hover { background-color: var(--button-hover); }

        .wallet-dropdown {
            display: none;
            list-style: none;
            padding: 0;
            margin: 5px 0 0 0;
            position: absolute;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            z-index: 10;
            overflow: hidden;
        }
        .wallet-dropdown li { padding: 12px 15px; cursor: pointer; }
        .wallet-dropdown li:hover { background-color: #383838; }

        #connectionDetails {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        #connectionDetails h3 {
            margin: 0 0 10px 0;
            font-size: 1em;
            color: var(--secondary-text);
            font-weight: 400;
        }
        #walletAddressDisplay, #walletBalanceDisplay {
            word-wrap: break-word;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        #signOutButton {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: none;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #signOutButton:hover {
            background-color: var(--danger-color);
            color: white;
        }

        #mintInterface {
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        
        .mint-status-bar {
            width: 100%;
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .mint-progress {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.5s ease-in-out;
        }

        .mint-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quantity-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: var(--primary-text);
            cursor: pointer;
            font-size: 1.2em;
        }
        #quantityInput {
            width: 50px;
            height: 30px;
            text-align: center;
            border: 1px solid var(--border-color);
            background: var(--background-color);
            color: var(--primary-text);
            font-family: inherit;
            border-radius: 4px;
        }
        /* Hides the default number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
          -webkit-appearance: none; 
          margin: 0; 
        }
        input[type=number] {
          -moz-appearance: textfield;
        }

        #mintButton {
            width: 100%;
            padding: 15px;
            font-size: 1.4em;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
            background-color: var(--accent-color);
            color: #121212;
            margin-top: 15px;
        }
        #mintButton:disabled {
            background-color: var(--disabled-color);
            cursor: not-allowed;
            color: var(--secondary-text);
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .main-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div>
            <!-- Collection Info -->
            <h1 class="collection-title">Ordinal Voyagers</h1>
            <p class="collection-description">A limited collection of unique explorers inscribed forever on the Bitcoin blockchain. Join the voyage.</p>
            
            <!-- Wallet Area -->
            <div id="walletArea">
                 <div class="wallet-connector" id="walletConnector">
                    <button class="connect-wallet-btn" id="connectWalletBtn">Connect Wallet to Mint</button>
                    <ul class="wallet-dropdown" id="walletDropdown">
                        <li data-wallet="xverse">Xverse</li>
                        <li data-wallet="unisat">UniSat</li>
                    </ul>
                </div>

                <div id="connectionDetails" class="hidden">
                    <h3>Connected Wallet</h3>
                    <div id="walletAddressDisplay"></div>
                    <div id="walletBalanceDisplay"></div>
                    <button id="signOutButton">Disconnect</button>
                </div>
            </div>

            <hr style="border-color: var(--border-color); margin: 30px 0;">

            <!-- Mint Interface -->
            <div id="mintInterface">
                <div class="mint-info-row">
                    <span>Supply</span>
                    <span id="supplyDisplay"></span>
                </div>
                <div class="mint-status-bar"><div class="mint-progress" id="mintProgressBar"></div></div>
                <hr style="border-color: var(--border-color); margin: 20px 0;">

                <div class="mint-info-row">
                    <span>Price</span>
                    <span id="mintPriceDisplay"></span>
                </div>

                <div class="mint-info-row">
                    <span>Quantity</span>
                    <div class="quantity-control">
                        <button class="quantity-btn" id="decreaseQtyBtn">-</button>
                        <input type="number" id="quantityInput" value="1" min="1" max="10">
                        <button class="quantity-btn" id="increaseQtyBtn">+</button>
                    </div>
                </div>

                <div class="mint-info-row" style="font-weight: 700; font-size: 1.2em;">
                    <span>Total</span>
                    <span id="totalCostDisplay"></span>
                </div>

                <button id="mintButton" disabled>Loading...</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Collection Configuration ---
            const MINT_PRICE_BTC = 0.000001;
            const COLLECTION_SIZE = 1000;
            const MINTED_SO_FAR = 15;
            const MAX_MINT_PER_TX = 10;
            const MINT_LIVE_DATE = new Date(); // Mint is live now!
            
            // --- State Variables ---
            let connectedAccount = null;
            let connectedWalletName = null;
            let mintIsLive = false;
            let countdownInterval;

            // --- DOM Elements ---
            const connectWalletBtn = document.getElementById('connectWalletBtn');
            const walletConnector = document.getElementById('walletConnector');
            const walletDropdown = document.getElementById('walletDropdown');
            const connectionDetails = document.getElementById('connectionDetails');
            const walletAddressDisplay = document.getElementById('walletAddressDisplay');
            const walletBalanceDisplay = document.getElementById('walletBalanceDisplay');
            const signOutButton = document.getElementById('signOutButton');
            const mintButton = document.getElementById('mintButton');
            const quantityInput = document.getElementById('quantityInput');
            const decreaseQtyBtn = document.getElementById('decreaseQtyBtn');
            const increaseQtyBtn = document.getElementById('increaseQtyBtn');
            const totalCostDisplay = document.getElementById('totalCostDisplay');
            const supplyDisplay = document.getElementById('supplyDisplay');
            const mintPriceDisplay = document.getElementById('mintPriceDisplay');
            const mintProgressBar = document.getElementById('mintProgressBar');

            // --- Wallet Connection Logic ---
            async function connectXverse() {
                try {
                    if (!window.XverseProviders || !window.XverseProviders.BitcoinProvider) {
                        throw new Error("Xverse provider not found.");
                    }
                    const resp = await window.XverseProviders.BitcoinProvider.request('wallet_connect', { addresses: ['ordinals', 'payment'] });
                    if (resp.error) throw new Error(resp.error.message);
                    
                    const ordAddr = resp.result.addresses.find(a => a.purpose === 'ordinals');
                    if (!ordAddr) throw new Error('Could not find Ordinals address.');
                    
                    const balResp = await window.XverseProviders.BitcoinProvider.request('get_balance', { address: ordAddr.address });
                    let totalBal = (balResp && balResp.result) ? balResp.result.total : 0;
                    
                    await handleWalletConnected(ordAddr.address, 'Xverse', totalBal);
                } catch (e) {
                    alert(`Failed to connect with Xverse: ${e.message}`);
                }
            }

            async function connectUnisat() {
                try {
                    if (typeof window.unisat === 'undefined') throw new Error("UniSat Wallet is not installed.");
                    const accounts = await window.unisat.requestAccounts();
                    if (accounts && accounts.length > 0) {
                        const balance = await window.unisat.getBalance();
                        await handleWalletConnected(accounts[0], 'UniSat', balance.total);
                        window.unisat.on('accountsChanged', (newAccounts) => handleWalletDisconnected());
                    }
                } catch (e) {
                    alert(`Failed to connect with UniSat: ${e.message}`);
                }
            }

            async function handleWalletConnected(address, walletName, balanceInSats) {
                connectedAccount = address;
                connectedWalletName = walletName;
                updateWalletUI(true, address, balanceInSats);
                updateMintButtonState();
            }

            async function handleWalletDisconnected() {
                connectedAccount = null;
                connectedWalletName = null;
                updateWalletUI(false);
                updateMintButtonState();
            }

            // --- UI & State Management ---
            function updateWalletUI(isConnected, address = '', balanceInSats = 0) {
                walletConnector.classList.toggle('hidden', isConnected);
                connectionDetails.classList.toggle('hidden', !isConnected);
                if (isConnected) {
                    const shortAddress = `${address.substring(0, 6)}...${address.substring(address.length - 4)}`;
                    walletAddressDisplay.innerText = `Address: ${shortAddress}`;
                    walletBalanceDisplay.innerText = `Balance: ${(balanceInSats / 1e8).toFixed(8)} BTC`;
                }
            }
            
            function updateMintButtonState() {
                const now = new Date();
                if (now >= MINT_LIVE_DATE) {
                    mintIsLive = true;
                    if (countdownInterval) clearInterval(countdownInterval);
                    if (connectedAccount) {
                        mintButton.textContent = "Mint Now";
                        mintButton.disabled = false;
                    } else {
                        mintButton.textContent = "Connect Wallet to Mint";
                        mintButton.disabled = true;
                    }
                } else {
                    mintIsLive = false;
                    mintButton.disabled = true;
                    updateCountdown();
                    if (!countdownInterval) {
                        countdownInterval = setInterval(updateCountdown, 1000);
                    }
                }
            }

            function updateCountdown() {
                const timeLeft = MINT_LIVE_DATE - new Date();
                if (timeLeft <= 0) {
                    updateMintButtonState();
                    return;
                }
                const d = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                const h = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((timeLeft % (1000 * 60)) / 1000);
                mintButton.textContent = `Mint starts in ${d}d ${h}h ${m}m ${s}s`;
            }

            function updateTotalCost() {
                const quantity = parseInt(quantityInput.value) || 0;
                totalCostDisplay.innerText = `${(quantity * MINT_PRICE_BTC).toFixed(8)} BTC`;
            }

            function initializeUI() {
                mintPriceDisplay.innerText = `${MINT_PRICE_BTC} BTC`;
                supplyDisplay.innerText = `${MINTED_SO_FAR} / ${COLLECTION_SIZE} MINTED`;
                quantityInput.max = MAX_MINT_PER_TX;
                mintProgressBar.style.width = `${(MINTED_SO_FAR / COLLECTION_SIZE) * 100}%`;
                updateTotalCost();
                updateMintButtonState();
            }

            // --- Event Listeners ---
            connectWalletBtn.addEventListener('click', () => { walletDropdown.style.display = 'block'; });
            signOutButton.addEventListener('click', handleWalletDisconnected);
            document.addEventListener('click', (e) => {
                if (!walletConnector.contains(e.target)) walletDropdown.style.display = 'none';
            });
            walletDropdown.addEventListener('click', (e) => {
                if (e.target.tagName === 'LI') {
                    walletDropdown.style.display = 'none';
                    if (e.target.dataset.wallet === 'unisat') connectUnisat();
                    else if (e.target.dataset.wallet === 'xverse') connectXverse();
                }
            });

            decreaseQtyBtn.addEventListener('click', () => {
                let qty = parseInt(quantityInput.value);
                if (qty > 1) {
                    quantityInput.value = qty - 1;
                    updateTotalCost();
                }
            });

            increaseQtyBtn.addEventListener('click', () => {
                let qty = parseInt(quantityInput.value);
                if (qty < MAX_MINT_PER_TX) {
                    quantityInput.value = qty + 1;
                    updateTotalCost();
                }
            });

            quantityInput.addEventListener('input', updateTotalCost);

            // --- The REAL MINT Logic ---
            mintButton.addEventListener('click', async () => {
                if (!connectedAccount || !mintIsLive) return;

                mintButton.disabled = true;
                mintButton.textContent = 'Preparing...';

                try {
                    // This is the URL to your backend function.
                    // If deploying on Netlify, this path is automatically correct.
                    const backendUrl = `/.netlify/functions/create-mint-order`;
                    
                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            recipientAddress: connectedAccount,
                            quantity: parseInt(quantityInput.value)
                        })
                    });

                    const orderData = await response.json();

                    if (!response.ok) {
                        throw new Error(orderData.error || 'Failed to create mint order.');
                    }
                    
                    // Open the payment modal with the data from our backend
                    const paymentUrl = `./payment-modal.html?address=${orderData.paymentAddress}&amount=${orderData.amountInSats}`;
                    window.open(paymentUrl, 'PaymentWindow', 'width=450,height=600,scrollbars=yes');

                } catch (error) {
                    alert(`Error: ${error.message}`);
                } finally {
                    updateMintButtonState(); // Reset button state
                }
            });

            initializeUI();
        });
    </script>
</body>
</html>
